<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgentGuard — AI Control Plane</title><style>
:root{--bg:#070a0f;--panel:#0d121a;--panel2:#111823;--line:#202a38;--text:#eef4ff;--muted:#8d9aad;--accent:#6ea8ff;--good:#36d399;--warn:#f5c451;--bad:#ff5d6c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#16253c 0,transparent 34%),var(--bg);color:var(--text);font:14px Inter,system-ui,Arial}button,input,select{font:inherit}.app{display:flex;min-height:100vh}.side{width:245px;background:#090d14;border-right:1px solid var(--line);padding:20px 14px;position:fixed;inset:0 auto 0 0}.brand{font-weight:800;font-size:20px;padding:10px 12px 25px}.brand span{color:var(--accent)}.org{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:18px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--muted);padding:11px 12px;border-radius:9px;cursor:pointer;margin:2px 0}.nav button:hover,.nav button.active{background:#151e2b;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:24px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.top h1{margin:0;font-size:25px}.actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#121a25;color:#fff;border-radius:9px;padding:10px 13px;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#07101e;font-weight:700}.danger{background:#3a141a;border-color:#67232b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,#111925,#0c1119);border:1px solid var(--line);border-radius:14px;padding:18px}.label{color:var(--muted);font-size:12px}.value{font-size:28px;font-weight:800;margin-top:8px}.section{margin-top:18px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionhead h2{font-size:16px;margin:0}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:13px 10px}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#172232;color:#a9c7ff;font-size:11px}.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.view{display:none}.view.active{display:block}.hero{padding:25px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,#101927,#0c121a)}.hero h2{margin:0 0 7px;font-size:22px}.hero p{color:var(--muted);max-width:760px}.split{display:grid;grid-template-columns:1.4fr .8fr;gap:15px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(520px,100%);background:#0e151f;border:1px solid var(--line);border-radius:15px;padding:20px}.dialog input,.dialog select{width:100%;background:#080d14;border:1px solid var(--line);color:#fff;padding:11px;border-radius:8px;margin:7px 0 14px}.toast{position:fixed;right:20px;bottom:20px;background:#172232;border:1px solid var(--line);padding:12px 16px;border-radius:10px;display:none}.mobile{display:none}@media(max-width:900px){.side{width:72px}.brand{font-size:0}.brand span{font-size:20px}.org,.nav button span{display:none}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}.actions{width:100%}.actions .btn{flex:1}.table{font-size:12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Agent<span>Guard</span></div><div class="org"><b>Acme Organization</b><div class="label">Enterprise workspace</div></div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><div class="label">CONTROL PLANE</div><h1 id="title">Overview</h1></div><div class="actions"><button class="btn" onclick="openModal('agent')">＋ Add Agent</button><button class="btn primary" onclick="openModal('policy')">Create Policy</button></div></div><div id="views"></div></main></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div><script>
const tabs=[['overview','◈','Overview'],['agents','◉','Agents'],['policies','◆','Policies'],['approvals','✓','Approvals'],['audit','≡','Audit Logs'],['threats','⚠','Threats'],['integrations','⌘','Integrations'],['team','♟','Team & RBAC'],['billing','◇','Billing'],['settings','⚙','Settings']];let current='overview',token=localStorage.ag_token;const nav=document.getElementById('nav'),views=document.getElementById('views');tabs.forEach(t=>nav.innerHTML+=`<button id="n-${t[0]}" onclick="show('${t[0]}')">${t[1]} <span>${t[2]}</span></button>`);function show(x){current=x;document.getElementById('title').textContent=tabs.find(t=>t[0]==x)[2];tabs.forEach(t=>document.getElementById('n-'+t[0]).classList.toggle('active',t[0]==x));render(x)}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body){opt.headers['Content-Type']='application/json'}let r=await fetch(path,opt);if(!r.ok)throw Error((await r.json()).detail||'Request failed');return r.json()}
function render(x){if(x==='overview')overview();else if(x==='agents')list('agents','Agents','Add Agent');else if(x==='policies')list('policies','Policies','Create Policy');else if(x==='approvals')table('/api/approvals',['id','agent','action','amount','status','created_at']);else if(x==='audit')table('/api/audit',['actor','agent','action','decision','created_at']);else if(x==='threats')table('/api/incidents',['severity','title','status','agent','created_at']);else if(x==='integrations')integrations();else if(x==='team')team();else if(x==='billing')billing();else settings()}
async function overview(){let a=await api('/api/agents'),p=await api('/api/policies'),l=await api('/api/audit');views.innerHTML=`<div class="hero"><h2>Your AI workforce. Under control.</h2><p>AgentGuard is the governance and audit layer between AI agents and real-world tools. Every protected action can be evaluated, blocked, or routed for human approval.</p><button class="btn primary" onclick="show('agents')">Manage agents →</button></div><div class="grid section"><div class="card"><div class="label">TOTAL AGENTS</div><div class="value">${a.length}</div><div class="good">● Registry connected</div></div><div class="card"><div class="label">ACTIVE AGENTS</div><div class="value">${a.filter(x=>x.status==='active').length}</div></div><div class="card"><div class="label">POLICIES</div><div class="value">${p.length}</div></div><div class="card"><div class="label">AUDIT EVENTS</div><div class="value">${l.length}</div></div></div><div class="split section"><div class="card"><div class="sectionhead"><h2>Recent activity</h2><button class="btn" onclick="show('audit')">View all</button></div><div id="recent"></div></div><div class="card"><h2>Security posture</h2><p class="label">Deterministic policy enforcement</p><h3 class="good">● Operational</h3><p class="label">Human approvals</p><h3>${(await api('/api/approvals')).length} pending records</h3><p class="label">Emergency control</p><button class="btn danger" onclick="toast('Select an agent to use its kill switch.')">Kill switch</button></div></div>`;let r=document.getElementById('recent');r.innerHTML=l.slice(0,6).map(x=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)"><b>${x.action}</b> <span class="badge">${x.decision}</span><div class="label">${x.agent||'system'} · ${x.created_at||''}</div></div>`).join('')||'<p class="label">No activity yet.</p>'}
async function list(endpoint,title,btn){let rows=await api('/api/'+endpoint);views.innerHTML=`<div class="card"><div class="sectionhead"><h2>${title}</h2><button class="btn primary" onclick="openModal('${endpoint==='agents'?'agent':'policy'}')">＋ ${btn}</button></div><table class="table"><thead><tr>${Object.keys(rows[0]||{name:'Name',status:'Status'}).slice(0,6).map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${Object.keys(rows[0]||r).slice(0,6).map(k=>`<td>${r[k]??''}</td>`).join('')}</tr>`).join('')}</tbody></table>${!rows.length?'<p class="label">No records yet. Create your first one.</p>':''}</div>`}
async function table(url,keys){let rows=await api(url);views.innerHTML=`<div class="card"><table class="table"><thead><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${keys.map(k=>`<td>${r[k]??''}</td>`).join('')}</tr>`).join('')}</tbody></table>${!rows.length?'<p class="label">No records yet.</p>':''}</div>`}
function connectIntegration(provider){api('/api/integrations/oauth/'+provider+'/start').then(x=>{if(x.authorization_url)location.href=x.authorization_url}).catch(e=>toast(e.message))}
function integrations(){views.innerHTML=`<div class="grid">${['Google Workspace','Microsoft 365','Slack','Salesforce','HubSpot','AWS / Azure / GCP','Generic REST / Webhooks','Customer Database'].map(x=>{let p=x.startsWith('Google')?'google':x==='Slack'?'slack':'';return `<div class="card"><h3>${x}</h3><p class="label">${p?'OAuth connector':'Scoped API / webhook connector'}</p><button class="btn" onclick="${p?`connectIntegration('${p}')`:`toast('${x}: configure provider credentials and webhook scopes')`}">Configure</button></div>`}).join('')}</div>`}function team(){views.innerHTML='<div class="card"><h2>Team & RBAC</h2><p class="label">Least-privilege roles</p><div class="grid">'+['Owner','Admin','Security','Developer','Approver','Viewer'].map(x=>`<div class="card"><b>${x}</b><p class="label">Role permission set</p></div>`).join('')+'</div></div>'}function billing(){views.innerHTML='<div class="card"><h2>Billing</h2><p class="label">Stripe subscription checkout</p><h2>Enterprise</h2><p>Set your Stripe Price ID in the checkout dialog. Server-side Stripe secrets remain private.</p><button class="btn primary" onclick="stripeCheckout()">Start subscription</button></div>'}
async function stripeCheckout(){let price=prompt('Stripe Price ID');if(!price)return;try{let x=await api('/api/billing/checkout',{method:'POST',body:JSON.stringify({price_id:price})});if(x.url)location.href=x.url}catch(e){toast(e.message)}}function settings(){views.innerHTML='<div class="grid"><div class="card"><h2>Security</h2><p>MFA · sessions · API keys · key rotation</p><button class="btn" onclick="showKeys()">API Keys</button> <button class="btn" onclick="mfaSetup()">Set up MFA</button></div><div class="card"><h2>Privacy</h2><p>Export or delete organization data.</p><button class="btn" onclick="api(\'/api/export\').then(x=>download(x,\'agentguard-export.json\'))">Export data</button> <button class="btn danger" onclick="deleteAccount()">Delete account</button></div><div class="card"><h2>Legal</h2><p>Terms · Privacy · Security · DPA</p><button class="btn" onclick="toast(\'Publish your reviewed legal documents before launch\')">Legal center</button></div></div>'}
function openModal(type){let d=document.getElementById('dialog');d.innerHTML=type==='agent'?`<h2>Add Agent</h2><input id="an" placeholder="Agent name"><input id="am" placeholder="Model / provider"><input id="ao" placeholder="Owner"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="createAgent()">Create</button>`:`<h2>Create Policy</h2><input id="pn" placeholder="Policy name"><input id="pa" placeholder="Action, e.g. payment.create"><input id="pr" placeholder="Resource or *" value="*"><select id="pe"><option>BLOCK</option><option>ALLOW</option><option>APPROVAL_REQUIRED</option></select><input id="pt" type="number" placeholder="Amount threshold"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="createPolicy()">Create</button>`;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}async function createAgent(){await api('/api/agents',{method:'POST',body:JSON.stringify({name:an.value,model:am.value,owner:ao.value})});closeModal();toast('Agent created');show('agents')}async function createPolicy(){await api('/api/policies',{method:'POST',body:JSON.stringify({name:pn.value,action:pa.value,resource:pr.value,effect:pe.value,threshold:+pt.value||0})});closeModal();toast('Policy created');show('policies')}async function mfaSetup(){try{let x=await api('/api/mfa/setup',{method:'POST'});alert('Authenticator secret: '+x.secret+'\n\nAdd it to your authenticator app, then use /api/mfa/verify with the code.')}catch(e){toast(e.message)}}
async function showKeys(){let x=await api('/api/api-keys');toast(x.length+' API keys active. Use backend endpoint to create scoped keys.')}async function deleteAccount(){if(confirm('Delete this organization and its stored records?')){await api('/api/account',{method:'DELETE'});localStorage.clear();location.reload()}}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}function download(x,n){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download=n;a.click()}show('overview');
if(!token){views.innerHTML='<div class="hero"><h2>AgentGuard Control Plane</h2><p>Secure governance for AI agents.</p><button class="btn primary" onclick="openLogin()">Sign in / Create workspace</button></div>'}function openLogin(){let d=document.getElementById('dialog');d.innerHTML='<h2>Workspace access</h2><button class="btn" onclick="oauth(\'google\')">Continue with Google</button><div class="label" style="margin:10px 0">or use email</div><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password (12+ chars)"><button class="btn primary" onclick="login()">Continue</button>';document.getElementById('modal').classList.add('open')}async function oauth(provider){let r=await fetch('/api/oauth/'+provider+'/start');let x=await r.json();if(x.authorization_url)location.href=x.authorization_url;else toast(x.detail||'OAuth unavailable')}
async function login(){try{let r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});token=r.access_token;localStorage.ag_token=token;closeModal();show('overview')}catch(e){await register()}}async function register(){let r=await api('/api/auth/register',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});token=r.access_token;localStorage.ag_token=token;closeModal();show('overview')}
</script></body></html>
